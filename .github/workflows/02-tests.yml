name: "Agent 02 — Tests"

on:
  workflow_run:
    workflows: ["Agent 01 — Planification"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  write-tests:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download refactor plan
        uses: actions/download-artifact@v4
        with:
          name: refactor-plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run blazor-test-engineer
        run: |
          ./run-agent.sh blazor-test-engineer \
            --plan input/refactor-plan.json \
            > test-coverage.json

      - name: Run generated tests
        run: |
          dotnet test --nologo -v q

      - name: Validate coverage output
        run: |
          test -s test-coverage.json
          jq -e 'has("coverage") and (.coverage >= 0)' test-coverage.json

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: test-coverage.json
          retention-days: 7