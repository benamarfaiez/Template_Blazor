name: "Agent 02 — Tests"

on:
  workflow_run:
    workflows: ["Agent 01 — Planification"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: agent-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  write-tests:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download refactor plan
        uses: actions/download-artifact@v4
        with:
          name: refactor-plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run blazor-test-engineer
        run: |
          ./run-agent.sh blazor-test-engineer \
            --plan input/refactor-plan.json \
            > test-coverage.json

      - name: Run generated tests
        run: |
          dotnet test --nologo -v q

      - name: Validate coverage output
        run: |
          test -s test-coverage.json
          jq -e 'has("coverage") and (.coverage >= 0)' test-coverage.json

      - name: Preserve test changes for refactoring
        env:
          TEST_BRANCH: refactor/agent-auto-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$TEST_BRANCH"
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m "test: add characterization tests for refactoring"
          fi
          git push origin "HEAD:$TEST_BRANCH"

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: test-coverage.json
          retention-days: 7

      - name: Upload refactor plan for execution
        uses: actions/upload-artifact@v4
        with:
          name: refactor-plan
          path: input/refactor-plan.json
          retention-days: 7