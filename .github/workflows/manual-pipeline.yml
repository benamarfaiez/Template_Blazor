name: "Pipeline manuel — Agents Blazor"

on:
  workflow_dispatch:
    inputs:
      start_step:
        description: "Étape de départ"
        required: true
        type: choice
        default: "audit"
        options:
          - audit
          - plan
          - tests
          - refactor
      dry_run:
        description: "Mode simulation (aucune modification réelle)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: manual-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  # ÉTAPE 1 : AUDIT (toujours exécutée si start_step = audit ou avant)
  # ---------------------------------------------------------------
  audit:
    if: ${{ inputs.start_step == 'audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run blazor-auditor
        run: |
          ./run-agent.sh blazor-auditor > audit-report.json

      - name: Validate audit output
        run: |
          test -s audit-report.json
          jq -e 'has("findings") or has("summary")' audit-report.json

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 3

  # ---------------------------------------------------------------
  # ÉTAPE 2 : PLANIFICATION
  # ---------------------------------------------------------------
  plan:
    if: |
      always() &&
      (inputs.start_step == 'audit' && needs.audit.result == 'success' ||
       inputs.start_step == 'plan')
    needs: [audit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download audit report
        if: ${{ inputs.start_step == 'audit' }}
        uses: actions/download-artifact@v4
        with:
          name: audit-report
          path: input/

      - name: Run blazor-refactor-planner
        run: |
          ./run-agent.sh blazor-refactor-planner \
            --input input/audit-report.json \
            > refactor-plan.json

      - name: Validate plan output
        run: |
          test -s refactor-plan.json
          jq -e 'has("increments") and (.increments | length > 0)' refactor-plan.json

      - name: Upload refactor plan
        uses: actions/upload-artifact@v4
        with:
          name: refactor-plan
          path: refactor-plan.json
          retention-days: 3

  # ---------------------------------------------------------------
  # ÉTAPE 3 : TESTS
  # ---------------------------------------------------------------
  tests:
    if: |
      always() &&
      (inputs.start_step == 'audit' && needs.plan.result == 'success' ||
       inputs.start_step == 'plan' && needs.plan.result == 'success' ||
       inputs.start_step == 'tests')
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download refactor plan
        if: ${{ inputs.start_step != 'tests' }}
        uses: actions/download-artifact@v4
        with:
          name: refactor-plan
          path: input/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run blazor-test-engineer
        run: |
          ./run-agent.sh blazor-test-engineer \
            --plan input/refactor-plan.json \
            > test-coverage.json

      - name: Run generated tests (déterministe)
        run: dotnet test --nologo -v q

      - name: Validate coverage output
        run: |
          test -s test-coverage.json
          jq -e 'has("coverage") and (.coverage >= 0)' test-coverage.json

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: test-coverage.json
          retention-days: 3

  # ---------------------------------------------------------------
  # ÉTAPE 4 : REFACTORING (avec dry_run optionnel)
  # ---------------------------------------------------------------
  refactor:
    if: |
      always() &&
      (inputs.start_step == 'audit' && needs.tests.result == 'success' ||
       inputs.start_step == 'plan' && needs.tests.result == 'success' ||
       inputs.start_step == 'tests' && needs.tests.result == 'success' ||
       inputs.start_step == 'refactor')
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download test coverage
        if: ${{ inputs.start_step != 'refactor' }}
        uses: actions/download-artifact@v4
        with:
          name: test-coverage
          path: input/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run blazor-refactoring-agent
        run: |
          ./run-agent.sh blazor-refactoring-agent \
            --coverage input/test-coverage.json \
            --dry-run ${{ inputs.dry_run }} \
            > execution-report.json

      - name: Validate refactoring output
        run: |
          test -s execution-report.json
          jq -e 'has("status")' execution-report.json

      - name: Upload execution report
        uses: actions/upload-artifact@v4
        with:
          name: execution-report
          path: execution-report.json
          retention-days: 3

      - name: Create Pull Request
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: refactor/agent-manual-${{ github.run_id }}
          base: main
          title: "refactor: application du plan (déclenchement manuel)"
          body: |
            PR générée par le pipeline manuel.
            - Exécution : ${{ github.run_id }}
            - Mode dry-run : ${{ inputs.dry_run }}
          labels: |
            agent:refactor
            automated
            manual-trigger

  # ---------------------------------------------------------------
  # ÉTAPE 5 : REVUE (déclenchée manuellement ou après la PR)
  # ---------------------------------------------------------------
  review:
    if: ${{ !inputs.dry_run && needs.refactor.result == 'success' }}
    needs: [refactor]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run blazor-code-review
        run: |
          # Note : la PR vient d'être créée, on peut récupérer son diff
          # via l'API ou en comparant avec la branche de base.
          ./run-agent.sh blazor-code-review \
            --base main \
            --head refactor/agent-manual-${{ github.run_id }} \
            > review.json

      - name: Publish review
        uses: actions/github-script@v7
        with:
          script: |
            const review = require('./review.json');
            // Publier la review sur la PR correspondante
            // (nécessite de récupérer le numéro de PR, voir note ci-dessous)