name: "Agent 03 — Refactoring"

on:
  workflow_run:
    workflows: ["Agent 02 — Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: write        # nécessaire pour pousser la branche
  pull-requests: write   # nécessaire pour créer la PR
  actions: read

concurrency:
  group: agent-refactor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refactor:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download test coverage
        uses: actions/download-artifact@v4
        with:
          name: test-coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run blazor-refactoring-agent
        run: |
          ./run-agent.sh blazor-refactoring-agent \
            --coverage input/test-coverage.json \
            > execution-report.json

      - name: Validate refactoring output
        run: |
          test -s execution-report.json
          jq -e 'has("status")' execution-report.json

      - name: Upload execution report
        uses: actions/upload-artifact@v4
        with:
          name: execution-report
          path: execution-report.json
          retention-days: 7

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: refactor/agent-auto-${{ github.run_id }}
          base: main
          title: "refactor: application du plan par blazor-refactoring-agent"
          body: |
            PR générée automatiquement par le pipeline d'agents.

            - Audit : exécution ${{ github.event.workflow_run.id }}
            - Plan : voir artefact `refactor-plan`
            - Tests : voir artefact `test-coverage`
            - Rapport d'exécution : voir artefact `execution-report`
          labels: |
            agent:refactor
            automated